<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Zombria – Administration</title>
<!--
  Panneau d'administration de ZOMBRIA (réservé à Fabien).
  Le mot de passe n'est écrit nulle part ici : c'est le secret Cloudflare ADMIN_MDP. Il est gardé dans
  l'onglet le temps de la visite (sessionStorage), puis oublié quand on ferme l'onglet ou qu'on se déconnecte.
-->
<style>
:root{--bg:#f3e6cf;--card:#fff8ec;--ink:#2a1d14;--mut:#6e5a48;--bois:#7a5232;--acc:#c9771f;--ok:#3f7d2a;--bad:#b23b26;--line:#d9c3a0}
@media (prefers-color-scheme:dark){:root{--bg:#1e1712;--card:#2a211a;--ink:#f3e6cf;--mut:#bfa98c;--bois:#a87a4f;--acc:#e8953a;--ok:#7fc463;--bad:#ff7a5c;--line:#4a3a2c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{margin:0 0 4px;font-size:24px}
.sub{color:var(--mut);margin:0 0 12px;font-size:13px}
.carte{background:var(--card);border:2px solid var(--bois);border-radius:14px;padding:14px;margin-bottom:12px}
input{font:inherit;padding:10px 12px;border:2px solid var(--bois);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
button{font:inherit;font-weight:700;padding:9px 14px;border:2px solid var(--ink);border-radius:10px;background:var(--acc);color:#2a1d14;cursor:pointer}
button.alt{background:var(--card);color:var(--ink);border-color:var(--bois)}
button.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg{min-height:1.4em;color:var(--bad);font-weight:600;margin:8px 0 0}
.msg.ok{color:var(--ok)}
.onglets{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.onglets button{background:var(--card);color:var(--ink);border-color:var(--bois)}
.onglets button.on{background:var(--acc);color:#2a1d14;border-color:var(--ink)}
.tuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.tuile{background:var(--card);border:2px solid var(--bois);border-radius:12px;padding:10px;text-align:center}
.tuile b{display:block;font-size:28px;line-height:1.1}
.tuile small{color:var(--mut);font-size:12px;font-weight:600}
.tableau{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.pastille{display:inline-block;padding:1px 8px;border-radius:9px;font-size:12px;font-weight:700}
.pastille.on{background:color-mix(in srgb,var(--ok) 25%,transparent);color:var(--ok)}
.pastille.off{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.cache{display:none}
/* Cadeau de l'équipe (2026-11-14) */
#fenCadeau{position:fixed;inset:0;background:rgba(20,12,6,.55);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:10}
#fenCadeau.cache{display:none}
#fenCadeau > .carte{width:min(640px,100%);margin:20px 0}
.cd-cats{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.cd-cats button{padding:4px 10px;font-size:13px}
.cd-objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;max-height:240px;overflow:auto;padding:2px}
.cd-o{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:12px;font-weight:600;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;text-align:center}
.cd-o img,.cd-l img{width:34px;height:34px;object-fit:contain}
.cd-o .em,.cd-l .em{font-size:26px;line-height:34px}
.cd-o.choisi{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--card))}
.cd-panier{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.cd-l{display:flex;align-items:center;gap:8px}
.cd-l span{flex:1}
.cd-l input{width:70px;padding:6px}
textarea{font:inherit;width:100%;padding:10px 12px;border:2px solid var(--bois);border-radius:10px;background:var(--bg);color:var(--ink);min-height:90px}
.cd-envoye{margin:6px 0 0;padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);font-size:13px;font-weight:700}
@media (max-width:560px){main{padding:12px}.tuile b{font-size:22px}}
</style>
</head>
<body>
<main>
  <h1>🛠️ Zombria – Administration</h1>
  <p class="sub">Réservé à l’auteur du jeu.</p>

  <section id="connexion" class="carte">
    <form id="formConnexion" class="row" autocomplete="off">
      <label for="mdp" style="width:100%;font-weight:700">Mot de passe</label>
      <input id="mdp" type="password" autocomplete="current-password" required style="flex:1;min-width:200px">
      <button type="submit">Entrer</button>
    </form>
    <p class="msg" id="msgConnexion"></p>
  </section>

  <section id="tableau" class="cache">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <div class="onglets" id="onglets">
        <button data-o="resume" class="on">📊 Résumé</button>
        <button data-o="joueurs">👥 Joueurs</button>
        <button data-o="classement">🏆 Classement</button>
        <button data-o="codes">🎟️ Codes</button>
        <button data-o="clans">🏰 Clans</button>
        <button data-o="avis">💬 Avis</button>
      </div>
      <button class="alt" id="deconnexion">Se déconnecter</button>
    </div>
    <p class="msg" id="msg"></p>
    <div id="contenu"></div>
  </section>
  <div id="fenCadeau" class="cache"><div class="carte">
    <div class="row" style="justify-content:space-between"><b style="font-size:18px">🎁 Cadeau pour <span id="cdNom"></span></b><button class="alt" id="cdFermer">✕</button></div>
    <p class="sub" style="margin-top:6px">Le joueur reçoit les objets dans sa partie en cours (dans les minutes qui suivent, ou à son prochain lancement), avec ton message.</p>
    <b>Objets</b>
    <div class="cd-cats" id="cdCats"></div>
    <div class="cd-objs" id="cdObjs"></div>
    <div class="cd-panier" id="cdPanier"></div>
    <b>Message</b>
    <textarea id="cdTexte" maxlength="600"></textarea>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="alt" id="cdAnnuler">Annuler</button><button id="cdEnvoyer">🎁 Envoyer le cadeau</button></div>
    <p class="msg" id="cdMsg"></p>
  </div></div>
</main>
<script src="data.js"></script>
<script>
(function(){
  var mdp = sessionStorage.getItem("survival_admin") || "", onglet = "resume";
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(t){ return String(t == null ? "" : t).replace(/[&<>"']/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); };
  var quand = function(t){ if(!t) return "—"; var m = Math.round((Date.now() - t) / 60000); return m < 60 ? "il y a " + m + " min" : m < 1440 ? "il y a " + Math.round(m / 60) + " h" : "il y a " + Math.round(m / 1440) + " j"; };
  // Export des données (déménagement vers o2switch) : le fichier est enregistré par le navigateur
  document.addEventListener("click", function(e){
    if(!e.target || e.target.id !== "exporter") return;
    e.target.disabled = true; e.target.textContent = "Préparation…";
    appel("exporter").then(function(d){
      e.target.disabled = false; e.target.textContent = "📥 Télécharger les données";
      if(d.erreur){ message(d.erreur); return; }
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(d)], { type:"application/json" }));
      a.download = "import.json"; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      message("✅ Fichier import.json téléchargé (" + Object.keys(d.donnees || {}).length + " ensembles de données).");
    }).catch(function(){ e.target.disabled = false; message("Impossible de joindre le serveur."); });
  });
  function appel(action, extra){
    var corps = Object.assign({ action:action }, extra || {});
    return fetch("/api/admin", { method:"POST", headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + mdp }, body:JSON.stringify(corps) })
      .then(function(r){ return r.json().then(function(d){ d._statut = r.status; return d; }); });
  }
  function message(t, ok){ var m = $("msg"); m.textContent = t || ""; m.className = "msg" + (ok ? " ok" : ""); }
  function deconnecter(raison){ mdp = ""; sessionStorage.removeItem("survival_admin"); $("tableau").className = "cache"; $("connexion").className = "carte"; $("msgConnexion").textContent = raison || ""; }
  $("formConnexion").addEventListener("submit", function(e){
    e.preventDefault(); mdp = $("mdp").value; $("mdp").value = ""; $("msgConnexion").textContent = "Vérification…";
    appel("resume").then(function(d){
      if(d.erreur){ deconnecter(d.erreur); return; }
      sessionStorage.setItem("survival_admin", mdp); $("connexion").className = "cache"; $("tableau").className = ""; afficher(d);
    }).catch(function(){ deconnecter("Impossible de joindre le serveur."); });
  });
  $("deconnexion").addEventListener("click", function(){ deconnecter("Déconnecté."); });
  $("onglets").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    onglet = b.getAttribute("data-o"); Array.prototype.forEach.call(this.children, function(x){ x.className = x === b ? "on" : ""; }); charger();
  });
  function charger(){
    message("");
    // les codes spéciaux sont dans le résumé
    appel(onglet === "codes" ? "resume" : onglet).then(function(d){ if(d._statut === 401 || d._statut === 429){ deconnecter(d.erreur); return; } if(d.erreur){ message(d.erreur); return; } afficher(d); })
      .catch(function(){ message("Impossible de joindre le serveur."); });
  }
  function tuile(v, t){ return '<div class="tuile"><b>' + esc(v) + '</b><small>' + esc(t) + '</small></div>'; }
  function afficher(d){
    var h = "";
    if(onglet === "resume"){
      h = '<div class="tuiles">' + tuile(d.joueurs, "joueurs (appareils)") + tuile(d.actifs24h, "actifs ces 24 h") + tuile(d.actifs7j, "actifs ces 7 jours")
        + tuile(d.enPartie, "familles en vie") + tuile(d.survivants, "survivants en vie") + tuile(d.parties, "parties jouées")
        + tuile(d.morts, "morts") + tuile(d.zombies, "zombies abattus") + tuile(d.classement, "au classement")
        + tuile(d.codes, "codes de parrainage") + tuile(d.parrainages, "parrainages réussis") + '</div>';
      h += '<div class="carte" style="margin-top:12px"><b>📦 Sauvegarde / déménagement</b><p style="margin:6px 0">Télécharge toutes les données du jeu (classement, clans, discussions, codes, avis) dans un fichier. À déposer chez o2switch sous le nom <code>donnees/import.json</code> dans le dossier du serveur.</p><button id="exporter">📥 Télécharger les données</button></div>';
      if(d.tombes && d.tombes.length) h += '<div class="carte" style="margin-top:12px"><b>💀 Dernières familles tombées</b><div class="tableau"><table><tr><th>Pseudo</th><th>Jour</th><th>Score</th><th>Quand</th></tr>'
        + d.tombes.map(function(t){ return '<tr><td>' + esc(t.n || "—") + '</td><td class="num">' + t.j + '</td><td class="num">' + t.s + '</td><td>' + quand(t.t) + '</td></tr>'; }).join("") + '</table></div></div>';
    } else if(onglet === "joueurs"){
      h = '<p class="sub">Les ' + d.joueurs.length + ' derniers joueurs vus (le plus récent en premier). Supprimer retire le joueur des chiffres du monde et du classement.</p><div class="carte tableau"><table><tr><th>Pseudo</th><th>Vu</th><th>En vie</th><th>Jour</th><th>Parties</th><th>Morts</th><th>Zombies</th><th>Record</th><th>Code</th><th></th></tr>'
        + d.joueurs.map(function(j){ return '<tr><td>' + esc(j.pseudo || "(sans pseudo)") + '</td><td>' + quand(j.vu) + '</td><td class="num">' + j.vivants + '</td><td class="num">' + (j.jour || "—") + '</td><td class="num">' + j.parties + '</td><td class="num">' + j.morts + '</td><td class="num">' + j.zombies + '</td><td class="num">' + (j.score == null ? "—" : j.score) + '</td><td>' + esc(j.code || "—") + (j.filleuls ? " (" + j.filleuls + ")" : "") + '</td><td class="row"><button title="Envoyer un cadeau" data-cadeau="' + esc(j.id) + '" data-nom="' + esc(j.pseudo || "ce joueur") + '">🎁</button><button class="danger" data-suppr="' + esc(j.id) + '" data-nom="' + esc(j.pseudo) + '">Supprimer</button></td></tr>'; }).join("") + '</table></div>';
    } else if(onglet === "classement"){
      h = '<div class="carte tableau"><table><tr><th>#</th><th>Pseudo</th><th>Score</th><th>Jours</th><th></th></tr>'
        + d.scores.map(function(s, k){ return '<tr><td class="num">' + (k + 1) + '</td><td>' + esc(s.pseudo) + '</td><td class="num">' + s.score + '</td><td class="num">' + s.jours + '</td><td><button class="danger" data-score="' + esc(s.id) + '" data-nom="' + esc(s.pseudo) + '">Retirer</button></td></tr>'; }).join("") + '</table></div>';
    } else if(onglet === "codes"){
      h = '<div class="carte"><form id="formCode" class="row"><input id="nouveauCode" maxlength="12" placeholder="Nouveau code spécial (ex. NOEL26)" style="flex:1;min-width:180px;text-transform:uppercase"><button type="submit">Créer</button></form>'
        + '<p class="sub" style="margin-top:8px">Un code spécial donne un colis à chaque appareil qui le tape (une fois par appareil).</p></div><div class="carte tableau"><table><tr><th>Code</th><th>État</th><th>Utilisations</th><th></th></tr>'
        + d.speciaux.map(function(c){ return '<tr><td><b>' + esc(c.code) + '</b></td><td><span class="pastille ' + (c.actif ? "on" : "off") + '">' + (c.actif ? "Actif" : "Désactivé") + '</span></td><td class="num">' + c.n + '</td><td class="row"><button class="alt" data-basculer="' + esc(c.code) + '">' + (c.actif ? "Désactiver" : "Activer") + '</button><button class="danger" data-codesuppr="' + esc(c.code) + '">Supprimer</button></td></tr>'; }).join("") + '</table></div>';
    }
    if(onglet === "avis"){
      var TY = { bug:"🐞 Bug", idee:"💡 Idée", autre:"💬 Autre" }, nl = d.avis.filter(function(a){ return !a.lu; }).length;
      h = '<div class="carte"><div class="row" style="justify-content:space-between"><b>✉️ E-mail à chaque avis</b><div class="row"><button class="alt" id="testMail">Envoyer un e-mail de test</button><button class="alt" id="testMailAvis">Tester comme un vrai avis</button></div></div>'
        + (d.dernierMail ? '<p class="sub" style="margin:8px 0 0">Dernier e-mail d’avis (' + quand(d.dernierMail.t) + ') : ' + (d.dernierMail.r && d.dernierMail.r.ok ? '✅ accepté par le serveur' : '❌ refusé') + ' — ' + esc(d.dernierMail.sujet || "") + '<br><small>' + esc(JSON.stringify(d.dernierMail.r)) + '</small></p>' : '<p class="sub" style="margin:8px 0 0">Aucun e-mail d’avis envoyé depuis la dernière mise à jour du serveur.</p>')
        + '<pre id="resMail" class="sub" style="white-space:pre-wrap;margin:8px 0 0"></pre></div>'
        + '<p class="sub">' + d.avis.length + ' message' + (d.avis.length > 1 ? "s" : "") + ' (' + nl + ' non lu' + (nl > 1 ? "s" : "") + '), le plus récent en premier. 5 messages par jour et par appareil au plus.</p>'
        + (d.avis.length ? d.avis.map(function(a){ var i = a.infos || {};
            return '<div class="carte"' + (a.lu ? ' style="opacity:.6"' : '') + '><div class="row" style="justify-content:space-between"><b>' + (TY[a.type] || a.type) + ' · ' + esc(a.pseudo || "(sans pseudo)") + '</b><small>' + quand(a.t) + '</small></div>'
              + '<p style="white-space:pre-wrap;margin:8px 0">' + esc(a.texte) + '</p>'
              + (i.ecran || i.jour || i.appareil ? '<p class="sub" style="font-size:12px">Jour ' + (i.jour || "?") + ' · écran ' + esc(i.ecran || "?") + (i.page ? ' · ' + esc(i.page) : '') + (i.version ? ' · version ' + esc(i.version) : '') + '<br>' + esc(i.appareil || "") + '</p>' : '')
              + (a.cadeau ? '<p class="cd-envoye">🎁 Cadeau envoyé ' + quand(a.cadeau.t) + ' : ' + esc(resumeObjets(a.cadeau.objets) || "message seul") + '</p>' : '')
              + '<div class="row">' + (a.idj ? '<button data-cadeau="' + esc(a.idj) + '" data-aid="' + esc(a.aid) + '" data-nom="' + esc(a.pseudo || "ce joueur") + '">🎁 Envoyer un cadeau</button>' : '') + '<button class="alt" data-avislu="' + esc(a.aid) + '">' + (a.lu ? "Marquer non lu" : "✔ Marquer lu") + '</button><button class="danger" data-avissuppr="' + esc(a.aid) + '">Supprimer</button></div></div>'; }).join("")
          : '<div class="carte">Aucun message pour l’instant.</div>');
    }
    if(onglet === "clans"){
      h = '<div class="carte"><form id="formJour" class="row"><label for="jourMin" style="font-weight:700">Jours de survie pour accéder aux clans</label><input id="jourMin" type="number" min="1" max="1000" value="' + d.jourMin + '" style="width:110px"><button type="submit">Enregistrer</button></form>'
        + '<p class="sub" style="margin-top:8px">100 par défaut. Baisse-le (ex. 1) pour tester les clans avec tes amis, puis remets 100.</p></div>'
        // AVANT-POSTE : jour d'accès à l'avant-poste
        + '<div class="carte"><form id="formJourAp" class="row"><label for="jourAp" style="font-weight:700">Jours de survie pour accéder à l’avant-poste</label><input id="jourAp" type="number" min="1" max="1000" value="' + (d.jourAvantposte || 50) + '" style="width:110px"><button type="submit">Enregistrer</button></form>'
        + '<p class="sub" style="margin-top:8px">50 par défaut. Baisse-le (ex. 1) pour tester l’avant-poste, puis remets 50. Le jeu le relit au lancement ; une fois débloqué sur un appareil, l’avant-poste y reste.</p></div>'
        + '<div class="carte"><b>🤖 Bots de test</b><p class="sub" style="margin:4px 0 8px">Des faux joueurs pour tester les clans, les guerres, les cadres et le classement. Les clans de bots cherchent toujours une guerre ; pendant une guerre, les bots (ennemis et équipiers) lancent leur assaut chaque jour tout seuls.</p>'
        + '<div class="row"><button data-botscreer="1">Créer 1 clan de bots</button><button data-botscreer="2">Créer 2 clans de bots</button><button class="danger" data-botssuppr="1">Supprimer tous les bots</button></div></div>'
        + '<div class="carte tableau"><table><tr><th>Clan</th><th>Chef</th><th>Familles</th><th>Jours</th><th>Membres</th><th></th></tr>'
        + d.clans.map(function(c){ return '<tr><td><b>' + (c.bot ? "🤖 " : "") + esc(c.nom) + '</b><br><small>' + (c.enGuerre ? "⚔️ en guerre" : c.recherche ? "🔎 cherche une guerre" : "") + '</small></td><td>' + esc(c.chef) + '</td><td class="num">' + c.membres + ' / 5' + (c.bots && !c.bot ? "<br><small>dont " + c.bots + " 🤖</small>" : "") + '</td><td class="num">' + c.jours + '<br><small>🏆 ' + (c.trophees || 0) + ' <button class="alt" style="padding:1px 6px;font-size:11px" data-trophees="' + esc(c.id) + '" data-val="' + (c.trophees || 0) + '">modifier</button></small></td><td style="white-space:normal;min-width:180px">' + esc(c.liste) + '</td><td class="row">' + (c.membres < 5 ? '<button class="alt" data-botscompleter="' + esc(c.id) + '">➕ Bots</button>' : '') + '<button class="danger" data-clansuppr="' + esc(c.id) + '" data-nom="' + esc(c.nom) + '">Dissoudre</button></td></tr>'; }).join("") + '</table></div>';
    }
    $("contenu").innerHTML = h;
    var testerMail = function(tm, extra){
      tm.disabled = true; $("resMail").textContent = "Envoi en cours…";
      appel("testMail", extra).then(function(d){ tm.disabled = false;
        if(d.erreur){ $("resMail").textContent = "❌ " + d.erreur; return; }
        var r = d.envoi || {};
        $("resMail").textContent = (r.ok ? "✅ Le serveur a accepté l’e-mail (de " + r.de + " vers " + r.a + "). Regarde ta boîte et les spams d’ici quelques minutes." : "❌ Le serveur n’a pas pu envoyer l’e-mail.") + "\n\nDétail technique : " + JSON.stringify(r);
      }).catch(function(){ tm.disabled = false; $("resMail").textContent = "Impossible de joindre le serveur."; });
    };
    var tm1 = $("testMail"); if(tm1) tm1.addEventListener("click", function(){ testerMail(tm1, {}); });
    var tm2 = $("testMailAvis"); if(tm2) tm2.addEventListener("click", function(){ testerMail(tm2, { commeAvis: true }); });
    var fj = $("formJour"); if(fj) fj.addEventListener("submit", function(e){ e.preventDefault(); action("reglageJourClan", { jour:$("jourMin").value }, "Réglage enregistré."); });
    var fa = $("formJourAp"); if(fa) fa.addEventListener("submit", function(e){ e.preventDefault(); action("reglageJourAvantposte", { jour:$("jourAp").value }, "Réglage enregistré."); }); // AVANT-POSTE
    var f = $("formCode"); if(f) f.addEventListener("submit", function(e){ e.preventDefault(); action("codeCreer", { code:$("nouveauCode").value }, "Code créé."); });
  }
  function action(a, extra, ok){ appel(a, extra).then(function(d){ if(d.erreur){ message(d.erreur); return; } charger(); setTimeout(function(){ message(ok, true); }, 300); }).catch(function(){ message("Impossible de joindre le serveur."); }); }
  $("contenu").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    if(b.dataset.cadeau){ ouvrirCadeau(b.dataset.cadeau, b.dataset.aid || "", b.dataset.nom || "ce joueur"); return; }
    if(b.dataset.avislu){ action("avisLu", { aid:b.dataset.avislu }, "C’est noté."); return; }
    if(b.dataset.avissuppr && confirm("Supprimer ce message ?")){ action("avisSupprimer", { aid:b.dataset.avissuppr }, "Message supprimé."); return; }
    if(b.dataset.suppr && confirm("Supprimer « " + (b.dataset.nom || "ce joueur") + " » des chiffres du monde et du classement ?")) action("supprimerJoueur", { id:b.dataset.suppr }, "Joueur supprimé.");
    else if(b.dataset.score && confirm("Retirer « " + b.dataset.nom + " » du classement ?")) action("supprimerScore", { id:b.dataset.score }, "Score retiré.");
    else if(b.dataset.basculer) action("codeBasculer", { code:b.dataset.basculer }, "Code modifié.");
    else if(b.dataset.trophees){ var v = prompt("Trophées de ce clan (0 à 5000) : Ferraille 0, Bronze 100, Argent 250, Or 450, Légende 700", b.dataset.val); if(v !== null) action("clanTrophees", { clan:b.dataset.trophees, trophees:v }, "Trophées modifiés."); }
    else if(b.dataset.botscreer) action("botsCreer", { clans:+b.dataset.botscreer }, "Bots créés.");
    else if(b.dataset.botscompleter) action("botsCompleter", { clan:b.dataset.botscompleter }, "Clan complété avec des bots.");
    else if(b.dataset.botssuppr && confirm("Supprimer TOUS les bots (clans de bots, bots dans les clans, au classement, guerres contre des bots) ?")) action("botsSupprimer", {}, "Bots supprimés.");
    else if(b.dataset.clansuppr && confirm("Dissoudre le clan « " + b.dataset.nom + " » ? Ses membres redeviennent sans clan.")) action("clanSupprimer", { clan:b.dataset.clansuppr }, "Clan dissous.");
    else if(b.dataset.codesuppr && confirm("Supprimer le code « " + b.dataset.codesuppr + " » ?")) action("codeSupprimer", { code:b.dataset.codesuppr }, "Code supprimé.");
  });
  /* ---------- Cadeau de l'équipe (2026-11-14) : objets du jeu (data.js) + message ---------- */
  var CATS_CADEAU = [["eau","💧 Eau"],["nour","🥫 Vivres"],["soin","🩹 Soins"],["arme","🗡️ Armes"],["munition","🔫 Munitions"],["outil","🔧 Outils"],["materiau","🪵 Matériaux"],["guerre","🛡️ Guerre"],["autre","📦 Autres"]];
  var TEXTE_CADEAU = "Merci de nous avoir contactés ! Désolés pour ce souci : voici de quoi remplacer ce que tu as perdu. Bonne survie ! — L’équipe ZOMBRIA";
  var cadeau = null, catCadeau = "eau";
  function catObjet(k){ var c = (OBJETS[k] || {}).cat; return CATS_CADEAU.some(function(x){ return x[0] === c; }) ? c : "autre"; }
  function nomObjet(k, n){ var o = OBJETS[k]; return o ? (n > 1 && o.pl ? o.pl : o.nom) : k; }
  function resumeObjets(ob){ return Object.keys(ob || {}).map(function(k){ return ob[k] + " " + nomObjet(k, ob[k]); }).join(", "); }
  function imgObjet(k){ return '<img src="images/icones/' + k + '.webp" alt="" data-em="' + esc((OBJETS[k] || {}).icone || "📦") + '" onerror="var s=document.createElement(\'span\');s.className=\'em\';s.textContent=this.dataset.em;this.replaceWith(s)">'; }
  function ouvrirCadeau(id, aid, nom){ cadeau = { id: id, aid: aid, objets: {} }; $("cdNom").textContent = nom; $("cdTexte").value = TEXTE_CADEAU; $("cdMsg").textContent = ""; dessinerCadeau(); $("fenCadeau").className = ""; }
  function fermerCadeau(){ $("fenCadeau").className = "cache"; cadeau = null; }
  function dessinerCadeau(){
    $("cdCats").innerHTML = CATS_CADEAU.map(function(c){ return '<button class="' + (c[0] === catCadeau ? "" : "alt") + '" data-cat="' + c[0] + '">' + c[1] + '</button>'; }).join("");
    $("cdObjs").innerHTML = Object.keys(OBJETS).filter(function(k){ return catObjet(k) === catCadeau; }).map(function(k){ return '<button class="cd-o' + (cadeau.objets[k] ? " choisi" : "") + '" data-obj="' + k + '">' + imgObjet(k) + esc(OBJETS[k].nom) + '</button>'; }).join("");
    var ks = Object.keys(cadeau.objets);
    $("cdPanier").innerHTML = ks.length ? ks.map(function(k){ return '<div class="cd-l">' + imgObjet(k) + '<span>' + esc(OBJETS[k].nom) + (OBJETS[k].empile ? "" : ' <small class="sub">(objet unique, neuf)</small>') + '</span><input type="number" min="1" max="99" value="' + cadeau.objets[k] + '" data-qte="' + k + '"><button class="danger" data-retire="' + k + '">✕</button></div>'; }).join("") : '<p class="sub" style="margin:0">Touche un objet pour l’ajouter (12 sortes au plus). Tu peux aussi n’envoyer qu’un message.</p>';
  }
  $("fenCadeau").addEventListener("click", function(e){
    if(e.target === this){ fermerCadeau(); return; }
    var b = e.target.closest("button"); if(!b) return;
    if(b.id === "cdFermer" || b.id === "cdAnnuler"){ fermerCadeau(); return; }
    if(b.dataset.cat){ catCadeau = b.dataset.cat; dessinerCadeau(); return; }
    if(b.dataset.obj){ var k = b.dataset.obj; if(cadeau.objets[k]) delete cadeau.objets[k]; else if(Object.keys(cadeau.objets).length < 12) cadeau.objets[k] = 1; dessinerCadeau(); return; }
    if(b.dataset.retire){ delete cadeau.objets[b.dataset.retire]; dessinerCadeau(); return; }
    if(b.id === "cdEnvoyer"){
      var ob = cadeau.objets, texte = $("cdTexte").value.trim();
      if(!Object.keys(ob).length && !texte){ $("cdMsg").textContent = "Choisis au moins un objet ou écris un message."; return; }
      b.disabled = true;
      appel("cadeauEnvoyer", { id: cadeau.id, aid: cadeau.aid, objets: ob, texte: texte }).then(function(d){
        b.disabled = false; if(d.erreur){ $("cdMsg").textContent = d.erreur; return; }
        fermerCadeau(); charger(); setTimeout(function(){ message("🎁 Cadeau envoyé. Le joueur le recevra dans sa partie.", true); }, 300);
      }).catch(function(){ b.disabled = false; $("cdMsg").textContent = "Impossible de joindre le serveur."; });
    }
  });
  $("fenCadeau").addEventListener("input", function(e){ var k = e.target.dataset.qte; if(k && cadeau) cadeau.objets[k] = Math.max(1, Math.min(99, Math.floor(+e.target.value) || 1)); });
  if(mdp){ $("connexion").className = "cache"; $("tableau").className = ""; charger(); }
})();
</script>
