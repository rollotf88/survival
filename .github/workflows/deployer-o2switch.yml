# Envoi automatique vers zombria.com chez o2switch (2026-11-14)
# À chaque envoi sur la branche main, GitHub copie par FTP sécurisé (FTPS, avec lftp) :
#   - le jeu (dossier site/)                 → compte FTP limité au dossier /zombria.com
#   - le serveur (dossier serveur-o2switch/) → compte FTP limité au dossier /zombria-serveur,
#     puis envoie tmp/restart.txt pour que o2switch redémarre le serveur.
# Images et sons : envoyés seulement si leur taille a changé (ou s'ils sont nouveaux). Pages, scripts et styles :
# toujours renvoyés (petits, et une modification peut garder la même taille, comme la version de sw.js).
# Rien n'est jamais supprimé sur le serveur (pas de --delete) : les données des joueurs (donnees/), le mot de passe
# (reglages.json), .well-known et api ne sont jamais touchés.
# Identifiants dans les « Secrets » du dépôt GitHub (jamais dans le code) :
#   FTP_HOTE, FTP_JEU_UTILISATEUR, FTP_JEU_MDP, FTP_SERVEUR_UTILISATEUR, FTP_SERVEUR_MDP
# (Premier essai avec SamKirkland/FTP-Deploy-Action : « ECONNRESET (data socket) » avec le FTPS d'o2switch.)
name: Envoi vers o2switch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deployer-o2switch
  cancel-in-progress: false

jobs:
  envoi:
    name: Jeu et serveur vers o2switch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Le jeu (zombria.com)
        env:
          HOTE: ${{ secrets.FTP_HOTE }}
          UTIL: ${{ secrets.FTP_JEU_UTILISATEUR }}
          LFTP_PASSWORD: ${{ secrets.FTP_JEU_MDP }}
        run: |
          cd site
          lftp --env-password -u "$UTIL" "$HOTE" <<'FIN'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:max-retries 6
          set net:reconnect-interval-base 5
          set net:timeout 40
          set cmd:fail-exit true
          mirror --reverse --ignore-time --no-perms --parallel=2 --verbose=1 --exclude-glob .git* --exclude-glob prompts-bruitages.md ./ ./
          mput -O ./ *.html *.js *.css *.json .htaccess
          bye
          FIN

      - name: Le serveur (zombria.com/api)
        env:
          HOTE: ${{ secrets.FTP_HOTE }}
          UTIL: ${{ secrets.FTP_SERVEUR_UTILISATEUR }}
          LFTP_PASSWORD: ${{ secrets.FTP_SERVEUR_MDP }}
        run: |
          cd serveur-o2switch
          mkdir -p tmp && date -u > tmp/restart.txt
          lftp --env-password -u "$UTIL" "$HOTE" <<'FIN'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:max-retries 6
          set net:reconnect-interval-base 5
          set net:timeout 40
          set cmd:fail-exit true
          mput -O ./ app.js package.json worker.mjs
          mkdir -p tmp
          put -O tmp/ tmp/restart.txt
          bye
          FIN
