# Envoi automatique vers zombria.com chez o2switch (2026-11-14)
# À chaque envoi sur la branche main, GitHub copie par FTP sécurisé (FTPS) :
#   - le jeu (dossier site/)            → compte FTP limité au dossier /zombria.com
#   - le serveur (dossier serveur-o2switch/) → compte FTP limité au dossier /zombria-serveur,
#     puis touche tmp/restart.txt pour que o2switch redémarre le serveur.
# Seuls les fichiers modifiés sont renvoyés (fichier .ftp-deploy-sync-state.json gardé sur le serveur).
# Les identifiants sont dans les « Secrets » du dépôt GitHub (jamais dans le code) :
#   FTP_HOTE, FTP_JEU_UTILISATEUR, FTP_JEU_MDP, FTP_SERVEUR_UTILISATEUR, FTP_SERVEUR_MDP
# Les données des joueurs (donnees/) et le mot de passe admin (reglages.json) ne sont jamais touchés :
# ils ne sont pas dans GitHub, et l'envoi ne supprime que des fichiers qu'il a lui-même envoyés.
name: Envoi vers o2switch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deployer-o2switch
  cancel-in-progress: false

jobs:
  jeu:
    name: Le jeu (zombria.com)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Envoi du dossier site/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOTE }}
          username: ${{ secrets.FTP_JEU_UTILISATEUR }}
          password: ${{ secrets.FTP_JEU_MDP }}
          protocol: ftps
          local-dir: ./site/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            sons/prompts-bruitages.md

  serveur:
    name: Le serveur (zombria.com/api)
    runs-on: ubuntu-latest
    needs: jeu
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le redémarrage
        run: mkdir -p serveur-o2switch/tmp && date -u > serveur-o2switch/tmp/restart.txt
      - name: Envoi du dossier serveur-o2switch/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOTE }}
          username: ${{ secrets.FTP_SERVEUR_UTILISATEUR }}
          password: ${{ secrets.FTP_SERVEUR_MDP }}
          protocol: ftps
          local-dir: ./serveur-o2switch/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            LISEZMOI.md
            donnees/**
            reglages.json
