# Le jeu déménage sur Cloudflare Pages (2026-11-09) : Netlify ne refait plus le site à chaque envoi
# (chaque mise à jour coûtait 15 de ses 300 crédits gratuits par mois). « exit 0 » = on saute.
[build]
  publish = "site"
  command = ""
  ignore = "exit 0"

[functions]
  directory = "netlify/functions"
